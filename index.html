<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영어 단어 놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff6f0; --card:#ffffff; --ink:#4a3b52; --sub:#9a8aa3; --line:#f1dfe6; --edge:#4a3b52;
  --accent:#ff7eb0; --accent-d:#e85c95; --accent-soft:#ffe8f1; --ok:#3fbf8a; --ok-soft:#e3f8ee; --bad:#ff6b6b; --bad-soft:#ffeaea;
  --m1:#ff9ec4; --m2:#ffc56e; --m3:#a8a4ff; --yellow:#fff1b8;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font-family:'Gowun Dodum','Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);background-image:radial-gradient(#ffd9e6 1.6px,transparent 1.6px);background-size:22px 22px;min-height:100vh}
button,input{font-family:inherit;color:var(--ink)}
.jua,header h1,.label,.btn,.mode b,.word,.meaning,.result-big,.qtype,.count,.chip,.stats b{font-family:'Jua','Gowun Dodum',sans-serif;font-weight:400}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
header h1{white-space:nowrap;font-size:26px;margin:0;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
header h1 .logo{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:var(--yellow);border:2.5px solid var(--edge);box-shadow:3px 3px 0 var(--edge);font-size:22px;transform:rotate(-6deg)}
header h1 span.pink{color:var(--accent)}
.badge{font-size:13px;color:var(--ink);background:var(--yellow);border:2px solid var(--edge);padding:5px 12px;border-radius:99px;font-family:'Jua',sans-serif}
.card{background:var(--card);border:2.5px solid var(--edge);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:5px 5px 0 #f7c6d9}
.label{font-size:17px;color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:6px}
.modes{display:grid;gap:10px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;background:#fff;border:2.5px solid var(--line);border-radius:20px;padding:12px 14px;cursor:pointer;transition:transform .15s, border-color .15s}
.mode:hover{transform:translateY(-2px)}
.mode .num{flex:none;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:26px;border:2.5px solid var(--edge)}
.mode b{display:block;font-size:18px;margin-bottom:2px}
.mode small{color:var(--sub);font-size:13px}
.mode.sel{border-color:var(--edge);background:var(--accent-soft);box-shadow:3px 3px 0 var(--edge)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;border-radius:14px;min-width:40px;height:40px;padding:0 12px;font-size:16px;cursor:pointer;transition:transform .1s}
.chip:hover:not(:disabled){transform:translateY(-1px)}
.chip.sel.rev{background:var(--ok)!important;color:#fff}
.chip.sel{background:var(--accent);color:#fff;border-color:var(--edge);box-shadow:2px 2px 0 var(--edge)}
.chip:disabled{opacity:.35;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:2.5px solid var(--edge);border-radius:18px;padding:14px 18px;font-size:19px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:4px 4px 0 var(--edge);transition:transform .1s, box-shadow .1s}
.btn:active:not(:disabled){transform:translate(3px,3px);box-shadow:1px 1px 0 var(--edge)}
.btn.full{width:100%}
.btn.ghost{background:#fff;color:var(--ink)}
.btn.small{padding:6px 12px;font-size:15px;border-radius:12px;box-shadow:2px 2px 0 var(--edge)}
.btn:disabled{opacity:.45;cursor:default}
.hint-text{font-size:13.5px;color:var(--sub);margin-top:10px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.bar{flex:1;height:16px;background:#fff;border:2.5px solid var(--edge);border-radius:99px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#ff9ec4 10px 20px);width:0;transition:width .3s;border-radius:99px}
.count{font-size:16px;color:var(--ink);min-width:62px;text-align:right}
.qcard{background:var(--card);border:2.5px solid var(--edge);border-radius:28px;padding:28px 20px 24px;text-align:center;margin-bottom:16px;box-shadow:6px 6px 0 #f7c6d9;position:relative}
.qcard::before{content:'';position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:70px;height:22px;background:#ffe27a;opacity:.85;border-radius:4px;rotate:-3deg}
.qtype{font-size:15px;color:var(--accent-d);margin-bottom:12px}
.word{font-size:48px;letter-spacing:-.5px;line-height:1.15;word-break:break-word}
.meaning{font-size:28px;line-height:1.4}
.defn{font-size:14.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.defn b{color:var(--ink)}
.sentence{font-size:22px;font-weight:700;line-height:1.7;text-align:left}
.blank{display:inline-block;min-width:90px;background:var(--yellow);border-bottom:3px dashed var(--accent);border-radius:8px 8px 0 0;color:var(--accent);text-align:center;padding:0 4px}
.sentence .hl{color:#fff;background:var(--ok);border-radius:8px;padding:0 6px}
.speak{border:2.5px solid var(--edge);background:var(--yellow);border-radius:99px;width:44px;height:44px;cursor:pointer;font-size:19px;margin-top:14px;box-shadow:2px 2px 0 var(--edge)}
.speak:active{transform:translate(2px,2px);box-shadow:none}
.opts{display:grid;gap:10px}
.opt{border:2.5px solid var(--line);background:#fff;border-radius:18px;padding:14px 16px;text-align:left;font-size:17px;font-weight:700;cursor:pointer;display:flex;gap:12px;align-items:center;transition:transform .1s}
.opt .k{flex:none;width:30px;height:30px;border-radius:10px;background:var(--accent-soft);display:grid;place-items:center;font-size:15px;color:var(--accent-d);font-family:'Jua',sans-serif}
.opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opt.bad .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.answer{display:flex;gap:8px}
.answer input{flex:1;min-width:0;border:2.5px solid var(--edge);border-radius:18px;padding:14px 16px;font-size:21px;font-weight:700;outline:none;background:#fff}
.answer input:focus{box-shadow:0 0 0 4px var(--accent-soft)}
.answer input.ok{border-color:var(--ok);background:var(--ok-soft)}
.answer input.bad{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.tools{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.link{background:#fff;border:2px dashed var(--line);border-radius:12px;color:var(--sub);font-size:14px;cursor:pointer;padding:7px 12px}
.link:hover:not(:disabled){border-color:var(--accent);color:var(--accent-d)}
.fb{border-radius:20px;padding:14px 16px;margin-top:14px;font-size:15.5px;line-height:1.6;display:none;border:2.5px solid var(--edge);animation:pop .3s}
.fb.ok{display:block;background:var(--ok-soft)}
.fb.bad{display:block;background:var(--bad-soft)}
.fb b{font-size:18px}
.fb .cheer{font-family:'Jua',sans-serif;font-size:18px;display:block;margin-bottom:2px}
.next{margin-top:14px}
.result-emoji{font-size:64px;text-align:center;line-height:1;animation:bounce 1.2s infinite}
.result-big{font-size:58px;text-align:center;letter-spacing:-1px;color:var(--accent)}
.result-sub{text-align:center;color:var(--sub);margin:6px 0 0;font-family:'Jua',sans-serif;font-size:17px}
.wlist{list-style:none;padding:0;margin:0}
.wlist li{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:2px dashed var(--line);font-size:15px}
.wlist li:last-child{border-bottom:0}
.wlist .en{font-weight:700;font-family:'Jua',sans-serif;font-size:17px}
.wlist .ko{color:var(--sub);text-align:right}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{border-radius:16px;padding:10px 4px;border:2px solid var(--edge)}
.stats div:nth-child(1){background:var(--ok-soft)}
.stats div:nth-child(2){background:var(--bad-soft)}
.stats div:nth-child(3){background:var(--yellow)}
.stats b{display:block;font-size:24px}
.stats small{font-size:13px;color:var(--sub)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.segb{border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:12px 8px;font-size:17px;cursor:pointer;font-family:'Jua',sans-serif;transition:transform .1s}
.segb:hover{transform:translateY(-1px)}
.segb.sel{background:var(--yellow);border-color:var(--edge);box-shadow:3px 3px 0 var(--edge)}
.opt.en span:last-child{font-family:'Jua',sans-serif;font-size:21px;font-weight:400}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.tab{border:2.5px solid var(--edge);background:#fff;border-radius:18px;padding:12px 6px;font-size:18px;cursor:pointer;font-family:'Jua',sans-serif;color:var(--ink)}
.tab.sel{background:var(--accent);color:#fff;box-shadow:3px 3px 0 var(--edge)}
.chip small{font-size:12px;opacity:.75}
.pill{display:inline-flex;align-items:center;gap:2px;border-radius:99px;padding:1px 8px;font-size:13px;font-family:'Jua',sans-serif;border:1.5px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:#16804f;border-color:#9fdcbf}
.pill.bad{background:var(--bad-soft);color:#d63c3c;border-color:#f6b0b0}
.pill.zero{opacity:.6}
.blist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.bitem{background:#fff;border:2px solid var(--line);border-radius:18px;overflow:hidden}
.bitem.open{border-color:var(--edge);box-shadow:3px 3px 0 #f7c6d9}
.bhead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;width:100%;background:none;border:0;text-align:left}
.bhead .en{font-family:'Jua',sans-serif;font-size:20px;flex:none}
.bhead .ko{color:var(--sub);font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .pills{display:flex;gap:4px;flex:none}
.bdetail{padding:4px 14px 14px;border-top:2px dashed var(--line)}
.bdetail .meanbig{font-size:17px;font-weight:700;margin:10px 0 2px}
.ex{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line);font-size:15.5px;line-height:1.5}
.ex:last-child{border-bottom:0}
.ex .t{flex:1}
.ex .t b{color:var(--accent-d)}
.ex.mine{background:var(--yellow);border-radius:10px;padding:8px;margin:4px 0;border-bottom:0}
.mini{border:1.5px solid var(--edge);background:#fff;border-radius:99px;width:32px;height:32px;cursor:pointer;flex:none;font-size:14px}
.tagline{font-size:12px;color:var(--sub);margin:2px 0 6px}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none}
.addrow input:focus{border-color:var(--accent)}
.addmsg{font-size:13px;margin-top:6px;color:var(--sub)}
.sword{font-size:26px;font-weight:800;line-height:1.4;word-break:break-word}
.bhead .en.s{font-size:16px;font-family:'Gowun Dodum',sans-serif;font-weight:700;flex:1;white-space:normal}
.bhead .en.s + .ko{display:none}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:10px;border-radius:16px}
#tAns{border:2.5px dashed var(--accent);background:#fff;margin-bottom:10px}
#tBank{background:var(--accent-soft)}
.tile{border:2px solid var(--edge);background:#fff;border-radius:12px;padding:8px 12px;font-size:17px;font-weight:700;cursor:pointer;box-shadow:2px 2px 0 var(--edge)}
.tile:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--edge)}
#tAns .tile{background:var(--yellow)}
.tiles.ok{border-color:var(--ok)!important;background:var(--ok-soft)!important}
.tiles.bad{border-color:var(--bad)!important;background:var(--bad-soft)!important}
.hide{display:none!important}
kbd{font-family:inherit;font-size:11px;border:1.5px solid var(--edge);border-bottom-width:3px;border-radius:6px;padding:1px 5px;background:#fff}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
@media (max-width:420px){header h1{font-size:21px}header h1 .logo{width:36px;height:36px;font-size:19px}.word{font-size:38px}.meaning{font-size:23px}.sentence{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="logo">🍓</span>영어 <span class="pink">단어</span> 놀이</h1>
    <button class="badge" id="vibBtn" style="cursor:pointer;white-space:nowrap">📳 진동 켜짐</button>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab sel" data-tab="setup">🎮 퀴즈 풀기</button>
    <button class="tab" data-tab="browse">📖 단어장 보기</button>
  </div>

  <div class="card" id="rangeCard">
    <div class="seg" id="kinds" style="margin-bottom:14px">
      <button class="segb sel" data-k="w">🔤 단어</button>
      <button class="segb" data-k="s">💬 문장</button>
    </div>
    <p class="label">📚 <span id="setLabel">단어장</span> 고르기 <small style="font-family:'Gowun Dodum';color:var(--sub);font-size:13px">여러 개 선택 가능</small></p>
    <div class="chips" id="sets">
      <button class="chip sel" data-set="S">🗣️ Spoken <small>721</small></button>
      <button class="chip" data-set="D">🧸 Dolch <small>874</small></button>
      <button class="chip" data-set="G">📗 Graded Reader <small>5000</small></button>
      <button class="chip" data-set="Y">✏️ 영어일기 단어 <small>181</small></button>
    </div>
    <div class="chips hide" id="ssets">
      <button class="chip sel" data-set="B">🧩 문장 조립 연습 <small>1202</small></button>
      <button class="chip" data-set="E">💬 실전 대화 표현 <small>219</small></button>
      <button class="chip" data-set="Y">✏️ 영어일기 문장 <small>56</small></button>
    </div>
    <div id="bBox" class="hide" style="margin-top:12px">
      <p class="hint-text" style="margin:0 0 8px">🧩 문장 조립 연습 단원</p>
      <div class="chips" id="bcat">
        <button class="chip sel" data-c="Be동사">Be동사</button>
        <button class="chip sel" data-c="일반동사">일반동사</button>
        <button class="chip sel" data-c="조동사">조동사</button>
      </div>
    </div>
    <div id="grBox" class="hide" style="margin-top:12px">
      <p class="hint-text" style="margin:0 0 8px">📗 Graded Reader 단계 (자주 쓰는 순서)</p>
      <div class="chips" id="grLv"></div>
    </div>
    <div id="letterBox">
    <p class="label" style="margin-top:16px">🌷 알파벳</p>
    <div class="chips" id="letters"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="chip" id="allBtn">전체 선택</button>
      <button class="chip" id="noneBtn">선택 해제</button>
      <button class="chip" id="wrongOnly">오답노트만 <span id="wrongN">(0)</span></button>
    </div>
    <p class="hint-text" id="rangeInfo"></p>
  </div>

  <!-- BROWSE -->
  <section id="browse" class="hide">
    <div class="card">
      <div class="answer"><input id="search" placeholder="🔍 영어나 뜻으로 찾기" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <div class="chips" id="sorts" style="margin-top:10px">
        <button class="chip sel" data-sort="abc" data-l="ABC순" data-r="ZYX순">ABC순</button>
        <button class="chip" data-sort="good" data-l="많이 맞은 순" data-r="많이 틀린 순">많이 맞은 순</button>
        <button class="chip" data-sort="total" data-l="많이 푼 순" data-r="안 풀어본 순">많이 푼 순</button>
      </div>
      <p class="hint-text" id="browseInfo"></p>
    </div>
    <ul class="blist" id="blist"></ul>
    <button class="btn ghost full hide" id="moreBtn" style="margin-top:10px">더 보기</button>
  </section>

  <!-- SETUP -->
  <section id="setup">
    <div class="card">
      <p class="label">🎀 어떤 문제를 풀까요?</p>
      <div class="modes">
        <button class="mode sel" data-mode="1"><span class="num" style="background:var(--m1)">🐰</span><span><b>영어 → 뜻</b><small>영어 단어를 보고 알맞은 뜻 고르기 (4지선다)</small></span></button>
        <button class="mode" data-mode="2"><span class="num" style="background:var(--m2)">🐻</span><span><b>뜻 → 영어</b><small>뜻을 보고 영어 단어 맞히기 (쓰기 / 4지선다)</small></span></button>
        <button class="mode" data-mode="3"><span class="num" style="background:var(--m3)">🐱</span><span><b>문장 빈칸 채우기</b><small>예문 3개 중 하나가 랜덤 출제, 가려진 단어 맞히기</small></span></button>
      </div>
      <div id="styleBox" class="hide" style="margin-top:16px;padding-top:14px;border-top:2px dashed var(--line)">
        <p class="label">✍️ 답하는 방식</p>
        <div class="seg" id="styles">
          <button class="segb sel" data-s="type">⌨️ 직접 쓰기</button>
          <button class="segb" data-s="choice">👆 4지선다</button>
        </div>
      </div>
    </div>

    <div class="card">
      <p class="label">🍭 몇 문제 풀까요?</p>
      <div class="chips" id="counts">
        <button class="chip" data-n="10">10</button>
        <button class="chip sel" data-n="20">20</button>
        <button class="chip" data-n="30">30</button>
        <button class="chip" data-n="50">50</button>
        <button class="chip" data-n="0">범위 전체</button>
      </div>
    </div>

    <button class="btn full" id="startBtn">시작하기 ✨</button>
    <p class="hint-text" style="text-align:center">v3.0 · 맞은/틀린 횟수와 오답노트는 이 기기에 자동 저장돼요 · <kbd>Enter</kbd> 제출/다음 · 4지선다는 <kbd>1</kbd>~<kbd>4</kbd></p>
    <div class="card" style="margin-top:14px">
      <p class="label">📒 오답노트</p>
      <ul class="wlist" id="noteList"></ul>
      <div class="row" style="margin-top:10px;justify-content:flex-end"><button class="link" id="clearNote">오답노트 비우기</button></div>
    </div>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hide">
    <div class="top">
      <button class="btn ghost small" id="quitBtn">✕</button>
      <div class="bar"><i id="barFill"></i></div>
      <span class="count" id="countTxt">1 / 20</span>
    </div>
    <div class="qcard">
      <div class="qtype" id="qtype"></div>
      <div id="qbody"></div>
      <div id="qrec" style="margin-top:14px;font-size:13px;color:var(--sub)"></div>
    </div>
    <div id="abody"></div>
    <div class="fb" id="fb"></div>
    <button class="btn full next hide" id="nextBtn">다음 문제</button>
  </section>

  <!-- RESULT -->
  <section id="result" class="hide">
    <div class="card">
      <div class="result-emoji" id="resEmoji"></div><div class="result-sub" id="resMode"></div>
      <div class="result-big" id="resScore"></div>
      <div class="stats" style="margin-top:14px">
        <div><b id="resOk"></b><small>맞음</small></div>
        <div><b id="resBad"></b><small>틀림</small></div>
        <div><b id="resPct"></b><small>정답률</small></div>
      </div>

/* ---------- storage ---------- */

function lsSet(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let stats = lsGet('ngsl_stats_v1');      // { word: [맞은 횟수, 틀린 횟수] }

}
const st = w => stats[w] || [0,0];

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.trim().toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ');
const byWord = {}; DATA.forEach(d => byWord[d.w] = d); SENT.forEach(d => byWord[d.w] = d);
function wordRe(w){ return new RegExp("(?<![A-Za-z])" + w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + "(?![A-Za-z])", w === 'I' ? 'g' : 'gi'); }
function sentencesFor(d, quizOnly){ const mine = (mySent[d.w]||[]).filter(x => !quizOnly || wordRe(d.w).test(x)); return d.s.concat(mine); }
function pickOne(a){ return a[Math.random()*a.length|0]; }
function confetti(n){ const em=['🌸','💖','⭐','🍓','✨','🎀']; for(let i=0;i<n;i++){ const s=document.createElement('span'); s.className='confetti'; s.textContent=pickOne(em); s.style.left=(Math.random()*100)+'vw'; s.style.animationDuration=(1.4+Math.random()*1.4)+'s'; s.style.animationDelay=(Math.random()*.3)+'s'; document.body.appendChild(s); setTimeout(()=>s.remove(),3200);} }

  if (!vibOn) return;
  try { if (window.AndroidTTS && AndroidTTS.vibrate) { AndroidTTS.vibrate(ms); return; } } catch(e) {}
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e) {}
}

function getPool(){
  const L = kind === 's' ? SENT : DATA;
  if (wrongOnly) return L.filter(d => note[d.w]);
  if (kind === 's') return SENT.filter(inSSets);
  return DATA.filter(d => inSets(d) && selLetters.has(d.w[0].toUpperCase()));

/* ---------- quiz ---------- */
let Q = [], qi = 0, okN = 0, wrongList = [], answered = false, curMode = 1, curStyle = 'type';
const MODE_NAME = {1:'🐰 영어 → 뜻', 2:'🐻 뜻 → 영어', 3:'🐱 문장 빈칸'};
const styleName = () => curMode === 1 ? '' : curStyle === 'choice' ? (Q[0] && isS(Q[0]) && curMode === 2 ? ' · 블록 조립' : ' · 4지선다') : ' · 쓰기';

function start(pool, n, m, st){
  curMode = m; curStyle = m === 1 ? 'choice' : (st || ansStyle);
  Q = shuffle(pool); if (n && n < Q.length) Q = Q.slice(0, n);
  qi = 0; okN = 0; wrongList = [];
  $('setup').classList.add('hide'); $('browse').classList.add('hide'); $('result').classList.add('hide'); $('quiz').classList.remove('hide'); showChrome(false);
  show();
}
$('startBtn').onclick = () => start(getPool(), countN, mode);

function show(){
  answered = false;
  const d = Q[qi];
  $('countTxt').textContent = `${qi+1} / ${Q.length}`;
  $('barFill').style.width = (qi / Q.length * 100) + '%';
  $('fb').className = 'fb'; $('fb').innerHTML = '';
  $('nextBtn').classList.add('hide');
  $('qrec').innerHTML = `이 ${isS(d)?'문장':'단어'} 기록 ${pills(d.w)}`;
  if (curMode === 1) showMode1(d);
  else if (curMode === 2) showMode2(d);
  else showMode3(d);

function tilesUI(d){
  const end = (d.w.match(/[.?!]+$/) || [''])[0];
  const words = d.w.replace(/[.?!]+$/, '').split(/\s+/).filter(Boolean);
  let order = shuffle(words.map((w,i) => i));
  for (let k=0; k<5 && words.length>1 && order.every((v,i)=>words[v]===words[i]); k++) order = shuffle(order);
  const ans = [];
  $('abody').innerHTML = `<div class="tiles" id="tAns"></div><div class="tiles" id="tBank"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="subBtn" style="flex:1" disabled>확인</button></div>
    <div class="tools"><button class="link" id="undoBtn">↩️ 다시 놓기</button><button class="link" id="skipBtn">🙈 모르겠어요</button></div>`;
  function draw(){
    $('tAns').innerHTML = ans.map((i,p) => `<button class="tile" data-p="${p}">${esc(words[i])}</button>`).join('') + (ans.length===words.length ? `<span style="align-self:center;font-weight:800">${esc(end)}</span>` : '');
    $('tBank').innerHTML = order.filter(i => !ans.includes(i)).map(i => `<button class="tile" data-i="${i}">${esc(words[i])}</button>`).join('') || '<span style="color:var(--sub);font-size:13px;align-self:center">다 놓았어요! 확인을 눌러요 👇</span>';
    $('subBtn').disabled = ans.length !== words.length;
  }
  $('tBank').onclick = e => { const b = e.target.closest('[data-i]'); if (!b || answered) return; ans.push(+b.dataset.i); draw(); };
  $('tAns').onclick = e => { const b = e.target.closest('[data-p]'); if (!b || answered) return; ans.splice(+b.dataset.p, 1); draw(); };
  $('undoBtn').onclick = () => { if (answered) return; ans.length = 0; draw(); };
  const done = skip => {
    if (answered) return;
    const ok = !skip && ans.map(i => words[i]).join(' ') === words.join(' ');
    $('tAns').classList.add(ok ? 'ok' : 'bad');
    ['subBtn','undoBtn','skipBtn'].forEach(id => $(id).disabled = true);
    revealText(ok, d, d.w);
  };
  $('subBtn').onclick = () => done(false);
  $('skipBtn').onclick = () => done(true);
  draw();
}
const normS = s => s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();

function choiceEN(d, ans){
  if (isS(d)) {
    const L = ans.toLowerCase();
    const near = shuffle(DATA.filter(x => !/[ A-Z]/.test(x.w) && x.w !== L && Math.abs(x.w.length - ans.length) <= 2)).slice(0, 3);
    const opts = shuffle([ans, ...near.map(x => x.w)]);
    $('abody').innerHTML = `<div class="opts">${opts.map((o,i) => `<button class="opt en" data-a="${esc(o)}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;

      if (answered) return;
      const ok = b.dataset.a === ans;
      $('abody').querySelectorAll('.opt').forEach(x => { x.disabled = true; if (x.dataset.a === ans) x.classList.add('ok'); });
      if (!ok) b.classList.add('bad');
      revealText(ok, d, ans);
    });
    return;
  }
  const shown = /[A-Z]/.test(d.w) ? d.w : ans.toLowerCase();
  const pool = DATA.filter(x => x.m !== d.m && x.w !== d.w);
  // 비슷한 길이의 단어를 우선 섞어서 너무 쉽지 않게

  const others = (near.length >= 3 ? near : shuffle(pool)).slice(0, 3);
  const opts = shuffle([{w: d.w, label: shown}, ...others.map(o => ({w: o.w, label: o.w}))]);
  $('abody').innerHTML = `<div class="opts">${opts.map((o,i) => `<button class="opt en" data-w="${esc(o.w)}"><span class="k">${i+1}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`;
  $('abody').querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (answered) return;
    const ok = byWord[b.dataset.w].m === d.m;
    $('abody').querySelectorAll('.opt').forEach(x => { x.disabled = true; if (byWord[x.dataset.w].m === d.m) x.classList.add('ok'); });
    if (!ok) b.classList.add('bad');
    revealText(ok, d, ans);
  });
}

function finish(ok, d, msg){

  const okWord = wordRe(w).test(v);
  refreshItem(li);
  li.querySelector('[data-msg]').innerHTML = isS(byWord[w]) ? '✅ 저장했어요!' : okWord ? '✅ 저장했어요! 문장 빈칸 문제에도 나와요.' : `💾 저장했어요. 다만 문장에 "${esc(w)}"가 그대로 없어서 빈칸 문제에는 안 나와요.`;
  li.querySelector('[data-add-in]').focus();
}

$('vibBtn').onclick = () => { vibOn = !vibOn; try { localStorage.setItem('ngsl_vib', vibOn ? 'on' : 'off'); } catch(e) {} renderVib(); if (vibOn) buzz(120); };
renderVib();
renderModes(); renderNote(); renderLetters();
</script>
</body>
</html>
